version: "3.9"

services:

  postgres:
    image: postgres:15
    container_name: dedetizacao-db
    restart: always
    environment:
      POSTGRES_DB: dedetizacao_db
      POSTGRES_USER: Admim
      POSTGRES_PASSWORD: Admim
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: dedetizacao-api
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dedetizacao_db
      SPRING_DATASOURCE_USERNAME: Admim
      SPRING_DATASOURCE_PASSWORD: Admim

volumes:
  postgres_data:
